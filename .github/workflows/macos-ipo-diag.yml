on:
  push:
    branches: [investigate-macos-x86-ipo]

name: macOS IPO diagnostics

# Investigation only: test two candidate fixes for macOS x86-64 builds with
# --ipo, where type info of classes without a key function is made local to
# executables, so that catching exceptions and dynamic_cast across libcvc5 /
# libcvc5parser and the executables fail.
#  - keyfn: give those classes key functions (.github/macos-ipo-fix.patch)
#  - export-dynamic: link executables with -Wl,-export_dynamic

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ipo-keyfn
            fix: true
          - name: ipo-export-dynamic
            extra: -DCMAKE_EXE_LINKER_FLAGS=-Wl,-export_dynamic
    name: macos-15-intel ${{ matrix.name }}
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6

    - name: Apply candidate fix
      if: matrix.fix
      run: git apply .github/macos-ipo-fix.patch && git diff --stat

    - name: Install dependencies
      uses: ./.github/actions/install-dependencies

    - name: Configure and build
      id: configure-and-build
      uses: ./.github/actions/configure-and-build
      with:
        configure-config: unrestricted --auto-download --ipo -DBUILD_GMP=1 ${{ matrix.extra }}
        macos-target: 10.13
        build-static: false
        strip-bin: strip

    - name: Build tests
      working-directory: ${{ steps.configure-and-build.outputs.shared-build-dir }}
      run: make -j${{ env.num_proc }} build-tests

    - name: Type info symbols
      continue-on-error: true
      working-directory: ${{ steps.configure-and-build.outputs.shared-build-dir }}
      run: |
        for f in src/libcvc5.dylib src/parser/libcvc5parser.dylib bin/cvc5 \
                 bin/test/api/cpp/issues/proj-issue373; do
          echo "== nm -m $f"
          nm -m "$f" | grep -E '__ZTIN4cvc5.*(Exception|DeclarationDefinitionCommand)E$' || echo "(none)"
        done

    - name: Tests as in CI (regress0-2, unit, API)
      working-directory: ${{ steps.configure-and-build.outputs.shared-build-dir }}
      env:
        CVC5_REGRESSION_ARGS: --no-early-exit
        RUN_REGRESSION_ARGS: --tester base --tester model --tester synth --tester abduct --tester dump
      run: |
        set +e
        ctest -j${{ env.num_proc }} -LE 'regress[3-4]' > ctest.log 2>&1
        status=$?
        grep -E 'tests passed|tests failed' ctest.log
        sed -n '/The following tests FAILED/,$p' ctest.log | head -100
        exit $status
